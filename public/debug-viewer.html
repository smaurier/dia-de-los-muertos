<!DOCTYPE html>
<!-- Viewer debug : /debug-viewer.html?glb=/chemin/vers.glb — vertex colors + toon -->
<html>
<head><meta charset="utf-8"><style>body{margin:0;background:#888}</style></head>
<body>
<script type="importmap">
  { "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  } }
</script>
<script type="module">
  import * as THREE from 'three'
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'

  const url = new URLSearchParams(location.search).get('glb')
  const scene = new THREE.Scene()
  scene.background = new THREE.Color('#8a8a8a')
  const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 50)
  const renderer = new THREE.WebGLRenderer({ antialias: true })
  renderer.setSize(innerWidth, innerHeight)
  document.body.appendChild(renderer.domElement)

  scene.add(new THREE.AmbientLight('#ffffff', 1.2))
  const dir = new THREE.DirectionalLight('#fff5e0', 1.5)
  dir.position.set(2, 3, 4)
  scene.add(dir)

  new GLTFLoader().load(url, gltf => {
    const obj = gltf.scene
    obj.traverse(o => {
      if (o.isMesh) {
        o.material = new THREE.MeshToonMaterial({
          vertexColors: !!o.geometry.getAttribute('color'),
          color: o.geometry.getAttribute('color') ? '#ffffff' : '#cccccc',
        })
        if (!o.geometry.hasAttribute('normal')) o.geometry.computeVertexNormals()
      }
    })
    const box = new THREE.Box3().setFromObject(obj)
    const size = box.getSize(new THREE.Vector3())
    const center = box.getCenter(new THREE.Vector3())
    camera.position.set(center.x + size.y * 0.9, center.y + size.y * 0.15, center.z + size.y * 1.4)
    camera.lookAt(center)
    scene.add(obj)
    let t = 0
    renderer.setAnimationLoop(() => {
      t += 0.004
      obj.rotation.y = t
      renderer.render(scene, camera)
    })
    window.__ready = true
  })
</script>
</body>
</html>
