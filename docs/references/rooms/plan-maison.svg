<?xml version="1.0" encoding="UTF-8"?>
<!--
  Plan de la maison — Día de Muertos
  Échelle : 20px = 1m
  Repère 3D → SVG :
    svg_x = 160 + (3d_x + 7) * 20   [salon : x∈[-7,7] → svg 160→440]
    svg_y = 520 - (3d_z + 5.8) * 20  [salon : z∈[-5.8,5.8] → svg 520→320]
  Murs pleins = existant dans SalonRoom.tsx
  Murs pointillés = à implémenter (chapitres futurs)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760">

  <!-- ═══════════ BACKGROUND ═══════════ -->
  <rect width="900" height="760" fill="#ede8de"/>

  <!-- ═══════════ TITLE ═══════════ -->
  <text x="450" y="30" text-anchor="middle"
        font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#2a1a0a">
    Día de Muertos — Plan de la maison
  </text>
  <text x="450" y="50" text-anchor="middle"
        font-family="sans-serif" font-size="10" fill="#888">
    Échelle 1:50 · 20 px = 1 m · Coordonnées salon issues de SalonRoom.tsx
  </text>

  <!-- ═══════════ ROOM FILLS ═══════════ -->

  <!-- Patio / Ofrenda (extérieur, à implémenter) -->
  <rect x="130" y="68" width="340" height="132" fill="#c4dfb0" stroke="none" rx="4"/>

  <!-- Cuisine (ch.2) -->
  <rect x="140" y="200" width="170" height="120" fill="#f5ddb0"/>

  <!-- Couloir NE — implémenté -->
  <rect x="370" y="236" width="70" height="84" fill="#e8d5f0"/>

  <!-- Salon (ch.1 / ch.4) — pièce principale -->
  <rect x="160" y="320" width="280" height="200" fill="#fef3dd"/>

  <!-- Zaguán (entrée est) — implémenté -->
  <rect x="440" y="364" width="80" height="80" fill="#e8e0c8"/>

  <!-- Couloir sud — implémenté (petit) -->
  <rect x="200" y="520" width="60" height="54" fill="#d5e8f5"/>

  <!-- Aile privée sud (à implémenter) — fond plus sombre -->
  <rect x="108" y="574" width="252" height="126" fill="#ddd8cc" rx="2"/>

  <!-- ═══════════ FURNITURE / PROPS ═══════════ -->

  <!-- Table repas (8.5m E-O, centre 3D x=-0.05 z=1.0 → svg 299,384) -->
  <rect x="214" y="363" width="170" height="42" fill="#c8a870" rx="2"/>
  <text x="299" y="389" text-anchor="middle"
        font-family="sans-serif" font-size="8" fill="#4a2a00">Table (20 couverts)</text>

  <!-- Chaises adultes (rangée nord, z=2.60 → svg_y=352) -->
  <rect x="218" y="349" width="12" height="9" fill="#9a6a40" rx="1"/>
  <rect x="234" y="349" width="12" height="9" fill="#9a6a40" rx="1"/>
  <rect x="250" y="349" width="12" height="9" fill="#9a6a40" rx="1"/>
  <rect x="266" y="349" width="12" height="9" fill="#9a6a40" rx="1"/>
  <rect x="282" y="349" width="12" height="9" fill="#9a6a40" rx="1"/>
  <rect x="298" y="349" width="12" height="9" fill="#9a6a40" rx="1"/>
  <rect x="314" y="349" width="12" height="9" fill="#9a6a40" rx="1"/>
  <rect x="330" y="349" width="12" height="9" fill="#9a6a40" rx="1"/>
  <rect x="346" y="349" width="12" height="9" fill="#9a6a40" rx="1"/>
  <rect x="362" y="349" width="12" height="9" fill="#9a6a40" rx="1"/>
  <text x="299" y="345" text-anchor="middle"
        font-family="sans-serif" font-size="7" fill="#777">adultes →</text>

  <!-- Chaises enfants (rangée sud, z=-0.60 → svg_y=416) -->
  <rect x="218" y="408" width="12" height="9" fill="#9a6a40" rx="1"/>
  <rect x="234" y="408" width="12" height="9" fill="#9a6a40" rx="1"/>
  <rect x="250" y="408" width="12" height="9" fill="#9a6a40" rx="1"/>
  <rect x="266" y="408" width="12" height="9" fill="#9a6a40" rx="1"/>
  <rect x="282" y="408" width="12" height="9" fill="#9a6a40" rx="1"/>
  <rect x="298" y="408" width="12" height="9" fill="#9a6a40" rx="1"/>
  <rect x="314" y="408" width="12" height="9" fill="#9a6a40" rx="1"/>
  <rect x="330" y="408" width="12" height="9" fill="#9a6a40" rx="1"/>
  <rect x="346" y="408" width="12" height="9" fill="#9a6a40" rx="1"/>
  <rect x="362" y="408" width="12" height="9" fill="#9a6a40" rx="1"/>
  <text x="299" y="427" text-anchor="middle"
