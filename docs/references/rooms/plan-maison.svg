  <!-- Canapé L + TV (coin SO du salon) -->
  <!-- Bras est-ouest le long du mur sud -->
  <rect x="168" y="494" width="56" height="18" fill="#7a5f3a" rx="2"/>
  <!-- Bras nord-sud le long du mur ouest -->
  <rect x="168" y="464" width="18" height="48" fill="#7a5f3a" rx="2"/>
  <!-- TV (mur ouest) -->
  <rect x="161" y="490" width="4" height="22" fill="#222" rx="1"/>
  <text x="170" y="460" font-family="sans-serif" font-size="7" fill="#5a3a10">Canapé + TV</text>
  <text x="170" y="470" font-family="sans-serif" font-size="7" fill="#5a3a10">Grand-oncle</text>

  <!-- Fauteuil grande-tante (x=-6.42, z=-0.6 → svg 131,432) -->
  <rect x="168" y="426" width="16" height="16" fill="#7a5f3a" rx="2"/>
  <text x="187" y="436" font-family="sans-serif" font-size="7" fill="#5a3a10">Fauteuil</text>

  <!-- Buffet (mur ouest nord) -->
  <rect x="162" y="330" width="14" height="40" fill="#8b6a3a" rx="1"/>

  <!-- Ofrenda altar dans le patio -->
  <rect x="210" y="92" width="68" height="46" fill="#c07848" rx="3"/>
  <text x="244" y="111" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#fff">Ofrenda</text>
  <text x="244" y="124" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#fff">ch. 8</text>

  <!-- Chien dans cuisine -->
  <text x="198" y="284" font-family="sans-serif" font-size="20">🐕</text>

  <!-- Miroir dans couloir sud -->
