  <text x="237" y="548" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#1a4a6a">Miroir</text>

  <!-- ═══════════ WALLS (existants = trait plein 3px) ═══════════ -->

  <!-- ── SALON mur NORD (y=320) ── -->
  <!-- Segment 1 : x=160→230 -->
  <line x1="160" y1="320" x2="230" y2="320" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>
  <!-- Arche cuisine : x=230→270, courbe vers le nord (cuisine) -->
  <path d="M 230 320 Q 250 306 270 320" fill="none" stroke="#444" stroke-width="1.5"/>
  <!-- Segment 2 : x=270→370 -->
  <line x1="270" y1="320" x2="370" y2="320" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>
  <!-- Arche couloir NE : x=370→410 -->
  <path d="M 370 320 Q 390 306 410 320" fill="none" stroke="#444" stroke-width="1.5"/>
  <!-- Segment 3 : x=410→440 -->
  <line x1="410" y1="320" x2="440" y2="320" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>

  <!-- ── SALON mur SUD (y=520) ── -->
  <!-- Segment 1 : x=160→210 -->
  <line x1="160" y1="520" x2="210" y2="520" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>
  <!-- Arche sud : x=210→250, courbe vers le sud -->
  <path d="M 210 520 Q 230 534 250 520" fill="none" stroke="#444" stroke-width="1.5"/>
  <!-- Segment 2 : x=250→440 -->
  <line x1="250" y1="520" x2="440" y2="520" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>

  <!-- ── SALON mur OUEST (x=160) ── -->
  <!-- Segment haut : y=320→362 -->
  <line x1="160" y1="320" x2="160" y2="362" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>
  <!-- Fenêtre : y=362→428 (pointillé bleu) -->
  <line x1="160" y1="362" x2="160" y2="428" stroke="#6ca0dc" stroke-width="3" stroke-dasharray="9,4"/>
  <!-- Segment bas : y=428→520 -->
  <line x1="160" y1="428" x2="160" y2="520" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>

  <!-- ── SALON mur EST (x=440) ── -->
  <!-- Segment haut : y=320→384 -->
  <line x1="440" y1="320" x2="440" y2="384" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>
  <!-- Arche zaguán : y=384→424, courbe vers l'est -->
  <path d="M 440 384 Q 454 404 440 424" fill="none" stroke="#444" stroke-width="1.5"/>
  <!-- Segment bas : y=424→520 -->
  <line x1="440" y1="424" x2="440" y2="520" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>

  <!-- ── CUISINE murs ── -->
  <line x1="140" y1="200" x2="140" y2="320" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>
  <line x1="140" y1="200" x2="310" y2="200" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>
  <line x1="310" y1="200" x2="310" y2="320" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>

  <!-- ── COULOIR NE murs ── -->
  <line x1="370" y1="236" x2="370" y2="320" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>
  <line x1="370" y1="236" x2="440" y2="236" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>
  <!-- mur est = mur est salon (déjà tracé) -->

  <!-- ── PATIO murs (existant en 3D via SalonRoom) ── -->
  <!-- Mur ouest patio = prolongation mur ouest cuisine -->
  <line x1="140" y1="68" x2="140" y2="200" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>
  <!-- Mur nord patio -->
  <line x1="130" y1="68" x2="470" y2="68" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>
  <!-- Mur est patio -->
  <line x1="470" y1="68" x2="470" y2="236" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>
  <!-- Mur sud patio : entre cuisine est (x=310) et couloir NE ouest (x=370) -->
  <line x1="310" y1="200" x2="370" y2="200" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>
  <!-- Et le segment est reliant le couloir NE au patio est -->
  <line x1="440" y1="236" x2="470" y2="236" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>
  <!-- Mur nord patio ouest (de 130 à 140) -->
  <line x1="130" y1="68" x2="130" y2="200" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>
  <line x1="130" y1="200" x2="140" y2="200" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>

  <!-- ── ZAGUÁN murs ── -->
  <line x1="440" y1="364" x2="520" y2="364" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>
  <line x1="520" y1="364" x2="520" y2="444" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>
  <line x1="520" y1="444" x2="440" y2="444" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>
  <!-- Porte extérieure zaguán (mur est x=520) : battants -->
  <!-- Déjà dans le mur est — on ajoute symbole de porte double -->
  <line x1="520" y1="394" x2="520" y2="414" stroke="#aaa" stroke-width="2" stroke-dasharray="2,2"/>
  <path d="M 520 394 L 502 394" stroke="#777" stroke-width="1" fill="none"/>
  <path d="M 520 394 Q 520 404 502 404" stroke="#777" stroke-width="1" fill="none"/>
  <path d="M 520 414 L 502 414" stroke="#777" stroke-width="1" fill="none"/>
  <path d="M 520 414 Q 520 404 502 404" stroke="#777" stroke-width="1" fill="none"/>

  <!-- ── COULOIR SUD murs ── -->
  <line x1="200" y1="520" x2="200" y2="574" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>
  <line x1="260" y1="520" x2="260" y2="574" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>
  <line x1="200" y1="574" x2="260" y2="574" stroke="#1a1a1a" stroke-width="3" stroke-linecap="square"/>

  <!-- ═══════════ MURS FUTURS (pointillés gris) ═══════════ -->
  <!-- Aile privée sud : ch.5 couloir, ch.6 chambre(s), ch.7 débarras -->

