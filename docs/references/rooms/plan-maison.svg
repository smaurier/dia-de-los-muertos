  <line x1="108" y1="574" x2="160" y2="574" stroke="#666" stroke-width="2" stroke-dasharray="8,5"/>
  <!-- Séparation interne : couloir futur (x=200-260) entre y=574 et y=700 -->
  <line x1="260" y1="620" x2="360" y2="620" stroke="#666" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Séparation chambre 1 et 2 (indicatif) -->
  <line x1="108" y1="640" x2="200" y2="640" stroke="#666" stroke-width="2" stroke-dasharray="6,4"/>

