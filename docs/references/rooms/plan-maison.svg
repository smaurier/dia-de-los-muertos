  <line x1="200" y1="574" x2="200" y2="700" stroke="#666" stroke-width="2" stroke-dasharray="8,5"/>
  <!-- Mur est débarras (x=360) -->
  <line x1="360" y1="574" x2="360" y2="700" stroke="#666" stroke-width="2" stroke-dasharray="8,5"/>
  <!-- Mur sud (y=700) -->
  <line x1="108" y1="700" x2="360" y2="700" stroke="#666" stroke-width="2" stroke-dasharray="8,5"/>
  <!-- Séparation débarras / couloir futur (y=574, x=260→360) -->
  <line x1="260" y1="574" x2="360" y2="574" stroke="#666" stroke-width="2" stroke-dasharray="8,5"/>
